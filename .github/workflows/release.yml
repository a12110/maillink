# 生成控制台（GUI）部署用的单文件 worker.js 与 APP_DB 的 SQL，用法见 docs/deploy-gui.md。
# - 推送 v* 标签：构建并发布到 GitHub Releases（已有同名 Release 时覆盖附件）；
# - 在 Actions 页手动运行：只构建，产物在本次运行的 Artifacts 里下载。
# 只在 GitHub 上构建，不连接任何 Cloudflare 账号，不需要配置任何 secrets。

name: Release worker.js

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 版本取根 package.json 的 packageManager
      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm --filter web build

      - name: Build single-file worker.js
        run: pnpm --filter worker build:single

      - name: Collect release files
        run: |
          mkdir -p release
          cp apps/worker/dist/single/worker.js release/worker.js
          cp apps/worker/dist/single/sql/app-db-init.sql release/app-db-init.sql
          cd apps/worker/dist/single/sql
          zip "$GITHUB_WORKSPACE/release/app-db-migrations.zip" [0-9]*.sql

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: maillink-single
          path: release/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: maillink-single
          path: release

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" release/* --generate-notes --title "$TAG" --repo "$GITHUB_REPOSITORY"
          fi
